[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polypai"
version = "0.1.0"
description = "End-to-end AI pipeline for colonoscopy polyp detection, segmentation, characterization, and explainable diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PolypAI contributors" }]
keywords = [
    "colonoscopy",
    "polyp",
    "medical-imaging",
    "segmentation",
    "detection",
    "NICE",
    "Paris-classification",
    "explainable-ai",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Heavy/optional deps (torch, opencv, etc.) are listed in requirements.txt and
# the optional-dependencies groups below so the pure-Python core (frame-scoring
# math, metrics, NBI synthesis) can be imported and unit-tested without a GPU.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = ["opencv-python-headless>=4.8", "scipy>=1.10", "scikit-image>=0.21"]
torch = ["torch>=2.2", "torchvision>=0.17"]
train = [
    "tensorboard>=2.14",
    "tqdm>=4.66",
    "albumentations>=1.3",
    "einops>=0.7",
    "timm>=0.9",
]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]
all = ["polypai[cv,torch,train,export,dev]"]

[project.scripts]
polypai-select-frames = "polypai.cli.select_frames:main"
polypai-train = "polypai.cli.train:main"
polypai-evaluate = "polypai.cli.evaluate:main"
polypai-infer = "polypai.cli.infer_video:main"
polypai-export = "polypai.cli.export_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "torch: tests that require PyTorch",
    "cv: tests that require OpenCV/scipy",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# Pragmatic ignores for a numeric/ML codebase:
#   E501  line length (long medical formulae / docstrings)
#   E741  "ambiguous" names l/I/O are meaningful here (FPN level `l`, Kudo `I`)
#   E702  intentional semicolons in compact numeric blocks
#   B905  zip(strict=) not needed for known-equal-length pyramid iterables
#   B007  unused loop indices in clear enumerate() loops
#   B008  np.arange default arg in metric signatures (immutable, intentional)
#   B028  warnings without stacklevel
ignore = ["E501", "E741", "E702", "B905", "B007", "B008", "B028"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
